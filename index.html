<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" id="theme-color" content="#fbfbfa" />
    <script>
      // Runs before first paint. React mounts far too late to prevent
      // the flash. localStorage throws in some privacy modes, hence try/catch.
      try {
        var stored = localStorage.getItem('theme');
        var isDark =
          stored === 'dark' ||
          (!stored && matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) document.documentElement.classList.add('dark');
        var meta = document.getElementById('theme-color');
        if (meta) meta.setAttribute('content', isDark ? '#0f0f11' : '#fbfbfa');
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
